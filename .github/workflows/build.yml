name: Build EDT Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'Makefile'
      - 'Tweak.xm'
      - 'control'
      - 'EDTProbe.plist'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          brew install ldid xz
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          xcrun --show-sdk-path --sdk iphoneos
      - name: Build rootless package
        run: |
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1
      - name: Prepare standalone dylib
        run: |
          mkdir -p artifacts/dylib
          staged_dylib="$(find .theos/_ -type f -name EDTProbe.dylib -print -quit)"
          staged_filter="$(find .theos/_ -type f -name EDTProbe.plist -print -quit)"
          test -n "$staged_dylib" && test -n "$staged_filter"
          cp "$staged_dylib" artifacts/dylib/EDTProbe.dylib
          cp "$staged_filter" artifacts/dylib/EDTProbe.plist
          test -s artifacts/dylib/EDTProbe.dylib
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: edt-probe-rootless
          path: packages/*.deb
          if-no-files-found: error
      - name: Upload dylib and injection filter
        uses: actions/upload-artifact@v4
        with:
          name: edt-probe-dylib
          path: artifacts/dylib/*
          if-no-files-found: error
